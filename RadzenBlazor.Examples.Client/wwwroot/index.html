<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radzen Blazor Examples</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-dark-base.css" />
    <style>
        html, body { margin: 0; height: 100%; }
        #app-loading {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; gap: 1rem; font-family: 'Segoe UI', Roboto, sans-serif;
            background: #181a1b; color: #e0e0e0;
        }
        #app-loading .spinner {
            width: 2.5rem; height: 2.5rem; border: 3px solid #444; border-top-color: #2196f3;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @@keyframes spin { to { transform: rotate(360deg); } }
        #blazor-error-ui {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000;
            box-sizing: border-box; padding: 0.6rem 1.25rem; background: lightyellow; color: #000;
            box-shadow: 0 -1px 2px rgba(0,0,0,0.2);
        }
        #blazor-error-ui .dismiss { cursor: pointer; position: absolute; right: 0.75rem; top: 0.5rem; }
    </style>
</head>

<body>
    <div id="app">
        <div id="app-loading">
            <div class="spinner"></div>
            <div>Loading Radzen Blazor Examples…</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
</body>

</html>
